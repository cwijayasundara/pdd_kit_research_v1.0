[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
bcrypt = "0.15"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verus standard library. Under plain cargo it is inert (proof code is
# erased); under the verus toolchain it provides Seq, prelude, etc.
# Version is pinned — record any bump in intent/decisions.md (D-toolchain).
vstd = "=0.0.0-2026-11-01-0251"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Tell cargo this crate opts into Verus verification.
[package.metadata.verus]
verify = true
